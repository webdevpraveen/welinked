name: welinked
description: WeLinked - Private couple alert system with instant attention alerts and acknowledgement tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_messaging: any

  # State Management
  flutter_riverpod: any

  # Navigation
  go_router: any

  # Location
  geolocator: any
  url_launcher: ^6.3.0

  # Background Services
  flutter_foreground_task: any
  workmanager: any

  # Device Info
  battery_plus: any
  connectivity_plus: any
  permission_handler: any

  # Alert UX
  audioplayers: any
  wakelock_plus: any
  flutter_local_notifications: any
  vibration: any

  # UI
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
