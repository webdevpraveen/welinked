name: welinked
description: WeLinked - Private couple alert system with instant attention alerts and acknowledgement tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.3.0

  # State Management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.3.0

  # Location
  geolocator: any
  url_launcher: ^6.3.0

  # Background Services
  flutter_foreground_task: ^9.2.2
  workmanager: any

  # Device Info
  battery_plus: any
  connectivity_plus: any
  permission_handler: any

  # Alert UX
  audioplayers: ^6.7.1
  wakelock_plus: any
  flutter_local_notifications: any
  vibration: any

  # UI
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/launcher_icon.png

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/launcher_icon.png"
  adaptive_icon_background: "#121220"
  adaptive_icon_foreground: "assets/launcher_icon.png"
